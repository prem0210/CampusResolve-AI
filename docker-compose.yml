services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: campusresolve-api
    environment:
      DATABASE_URL: sqlite:////app/storage/campusresolve.db
      TOKENIZERS_PARALLELISM: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: campusresolve-api
      JWT_AUDIENCE: campusresolve-client
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    volumes:
      - campusresolve_data:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: campusresolve-dashboard
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  campusresolve_data:
    name: campusresolve_data
